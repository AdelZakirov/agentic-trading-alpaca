[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-market-agent"
version = "0.1.0"
description = "Whole-market Alpaca data fetching for a trading agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
screening = ["yfinance>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["alpaca_agent*"]
